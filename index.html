<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FINCELL, the Finance Cell of St. Xavier's College, Mumbai. Student-led financial research, market intelligence, events, blogs, and analytics.">
  <title>FINCELL - Finance Cell, St. Xavier's College</title>
  <link rel="icon" type="image/png" href="./fincelllogo.png">
  <link rel="stylesheet" href="./styles.css">
  <script>
    (function () {
      try {
        var s = localStorage.getItem('fcTheme');
        if (s === 'light' || (!s && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <canvas id="market-bg" aria-hidden="true"></canvas>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="siteHeader">
    <a class="brand" href="/" data-route="home" aria-label="FINCELL home">
      <img class="brand-mark" src="./fincelllogo.png" alt="" aria-hidden="true">
      <span><strong>FINCELL</strong><small>St. Xavier's College</small></span>
    </a>
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="primary-nav" id="primaryNav" aria-label="Primary navigation"></nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer" id="siteFooter"></footer>
  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Image preview">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close image preview">Close</button>
    <img id="lightboxImage" alt="">
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
